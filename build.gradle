plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('quickplay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickplay')
            }
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
        content { includeGroup "mezz.jei"; includeGroup "net.mezzdev.config" }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.70.0.469"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.70.0.469"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.70.0.469"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                             neo_version      : neo_version, neo_version_range: neo_version_range,
                             loader_version_range: loader_version_range,
                             mod_id           : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors      : mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    exclude '**/*.disabled/**'
    exclude '**/*.disabled'
    exclude 'data/requiemunofficial/advancements/recipes/tachylite/**'

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
